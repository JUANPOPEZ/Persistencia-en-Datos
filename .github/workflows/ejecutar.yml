name: Ejecutar demostración

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac -d out src/*.java
      - run: java -Dstdout.encoding=UTF-8 -cp out Main --demo < demo/entrada_demo.txt
