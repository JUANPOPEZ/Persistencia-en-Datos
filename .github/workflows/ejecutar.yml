name: Ejecutar demostración

# Se ejecuta solo cada vez que se sube código a GitHub
# y también manualmente desde la pestaña "Actions".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar el proyecto
        run: javac -d out src/*.java

      - name: Ejecutar la demostración automática
        # La consola es interactiva; aquí las respuestas del usuario
        # se leen desde demo/entrada_demo.txt para que corra sola.
        run: java -Dstdout.encoding=UTF-8 -cp out Main --demo < demo/entrada_demo.txt | tee salida_demo.txt

      - name: Mostrar el resultado en el resumen de la ejecución
        run: |
          echo '### Resultado de la demostración' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat salida_demo.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
